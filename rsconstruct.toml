# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

[build]

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
src_dirs = ["tera.templates"]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["src", "notes"]

[processor.zspell]
src_dirs = ["src", "notes"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src", "config"]

[processor.pylint]
src_dirs = ["src", "config"]

[processor.mypy]
src_dirs = ["src", "config"]

[processor.requirements]
src_dirs = ["src", "config"]

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# Install the pinned demo libraries so pylint/mypy can resolve the imports in
# the exercises; without this CI has none of them and every import fails.
[dependencies]
pip = [
	"-r",
	"requirements.txt",
]
