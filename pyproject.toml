[project]
name = "demos-lang-python-bioinformatics"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy",
    "pylint",
    "pytest",
    "ruff",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.mypy]
mypy_path = "src:python:scripts"
explicit_package_bases = true
namespace_packages = true
